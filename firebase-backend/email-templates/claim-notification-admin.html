<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>New claim request, RE-LOVED</title>
<!--[if mso]>
<noscript>
<xml>
<o:OfficeDocumentSettings>
<o:PixelsPerInch>96</o:PixelsPerInch>
</o:OfficeDocumentSettings>
</xml>
</noscript>
<style>
  table { border-collapse: collapse; }
  .fallback-fixed { width: 540px; }
</style>
<![endif]-->
<style>
  body, table, td { font-family: 'Manrope', Arial, Helvetica, sans-serif; }
  body { margin: 0; padding: 0; background-color: #EBE7DF; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table { border-collapse: collapse; }
  img { border: 0; display: block; }
  a { text-decoration: none; }
  .display { font-family: 'Bricolage Grotesque', Arial, Helvetica, sans-serif; }

  .fluid { width: 100%; max-width: 540px; }
  .fluid-card { width: 100%; }

  @media only screen and (max-width: 600px) {
    .outer-pad { padding-left: 12px !important; padding-right: 12px !important; }
    .pad { padding-left: 22px !important; padding-right: 22px !important; padding-top: 30px !important; padding-bottom: 26px !important; }
    .headline { font-size: 20px !important; }
    .cta-btn { display: block !important; width: 100% !important; box-sizing: border-box; }
    .wordmark-pad { padding: 7px 14px !important; }
    .wordmark-text { font-size: 14px !important; letter-spacing: 2px !important; }
  }

  @media only screen and (min-width: 601px) {
    .headline { font-size: 24px; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#EBE7DF;">

<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
  {{ params.REQUESTER_NAME }} requested to claim "{{ params.ITEM_TITLE }}".
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EBE7DF;">
<tr>
<td align="center" class="outer-pad" style="padding: 40px 16px;">

  <!--[if mso]>
  <table role="presentation" align="center" class="fallback-fixed" cellpadding="0" cellspacing="0"><tr><td>
  <![endif]-->

  <table role="presentation" class="fluid" align="center" cellpadding="0" cellspacing="0" style="width:100%; max-width:540px;">

    <!-- Wordmark -->
    <tr>
      <td align="center" style="padding-bottom: 26px;">
        <table role="presentation" cellpadding="0" cellspacing="0">
          <tr>
            <td class="wordmark-pad" style="background-color:#111111; border-radius:6px; padding: 8px 18px;">
              <span class="display wordmark-text" style="font-size:16px; font-weight:900; letter-spacing:3px; text-transform:uppercase; color:#F4F1EA;">
                RE&#8209;LOVED <span style="color:#8a8a8a; font-weight:700;">ADMIN</span>
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Card -->
    <tr>
      <td>
        <table role="presentation" class="fluid-card" cellpadding="0" cellspacing="0" style="width:100%; background-color:#111111; border-radius:8px;">
          <tr>
            <td style="padding: 0 4px 4px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF; border:1.5px solid #111111; border-radius:8px;">
                <tr>
                  <td class="pad" style="padding: 36px 40px 32px 40px;">

                    <!-- Eyebrow -->
                    <table role="presentation" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="background-color:#F42B8C; border-radius:20px; padding: 6px 16px;">
                          <span class="display" style="font-size:11px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:#FFFFFF; white-space:nowrap;">
                            Action Needed
                          </span>
                        </td>
                      </tr>
                    </table>

                    <!-- Headline -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="padding-top: 18px; padding-bottom: 16px;">
                          <span class="display headline" style="line-height:1.2; font-weight:900; text-transform:uppercase; color:#111111;">
                            New claim request
                          </span>
                        </td>
                      </tr>
                    </table>

                    <!-- Details table -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E5E1D8; border-radius:6px;">
                      <tr>
                        <td style="padding:12px 16px; border-bottom:1px solid #E5E1D8;">
                          <span style="font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#8a8a8a;">Item</span><br>
                          <span style="font-size:14px; color:#111111; font-weight:700;">{{ params.ITEM_TITLE }}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:12px 16px; border-bottom:1px solid #E5E1D8;">
                          <span style="font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#8a8a8a;">Requested by</span><br>
                          <span style="font-size:14px; color:#111111;">{{ params.REQUESTER_NAME }}</span>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:12px 16px;">
                          <span style="font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#8a8a8a;">Contact</span><br>
                          <span style="font-size:14px; color:#111111;">{{ params.REQUESTER_PHONE }}</span>
                        </td>
                      </tr>
                    </table>

                    <!-- CTA -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:24px;">
                      <tr>
                        <td align="center">
                          <table role="presentation" cellpadding="0" cellspacing="0" class="cta-btn">
                            <tr>
                              <td style="background-color:#111111; border-radius:6px;">
                                <a href="{{ params.DASHBOARD_URL }}" target="_blank" class="display" style="display:inline-block; padding:14px 32px; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:#F4F1EA;">
                                  Review in Dashboard &rarr;
                                </a>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Footer -->
    <tr>
      <td align="center" style="padding: 26px 16px 0 16px;">
        <span style="font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#595959;">
          RE&#8209;LOVED &middot; Internal Notification
        </span>
      </td>
    </tr>

  </table>

  <!--[if mso]>
  </td></tr></table>
  <![endif]-->

</td>
</tr>
</table>

</body>
</html>
