<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>reloved - Preloved for free</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/images/reloved-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Images are hosted on cPanel (reloved.digital/images/...), not bundled with the app — warm the connection early so the first asset fetch isn't paying DNS+TLS on top of the request itself. -->
    <link rel="preconnect" href="https://reloved.digital">
    <link rel="dns-prefetch" href="https://reloved.digital">
    <!-- Preload the hero background (default courtyard photo) at each breakpoint it's actually used at, matching the <picture> sources in Home.tsx, so the browser starts fetching it immediately instead of waiting for React to mount and render the <img>. -->
    <link rel="preload" as="image" href="https://reloved.digital/images/hero-bg-mobile.png" media="(max-width: 767px)">
    <link rel="preload" as="image" href="https://reloved.digital/images/hero-bg-tablet.png" media="(min-width: 768px) and (max-width: 1023px)">
    <link rel="preload" as="image" href="https://reloved.digital/images/hero-bg-laptop.png" media="(min-width: 1024px) and (max-width: 1279px)">
    <link rel="preload" as="image" href="https://reloved.digital/images/hero-bg-desktop.png" media="(min-width: 1280px)">
    <link rel="preload" as="image" href="https://reloved.digital/images/reloved-logo.png">
    <link rel="preload" as="image" href="https://reloved.digital/images/reloved-logo-on-dark.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Manrope:wght@200..800&family=Inter:wght@400..800&family=Fraunces:opsz,wght@9..144,300..700&family=Baloo+2:wght@500..800&family=Nunito:wght@400..800&family=Bebas+Neue&family=Lora:wght@400..700&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
