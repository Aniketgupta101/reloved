services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reloved
      POSTGRES_PASSWORD: reloved
      POSTGRES_DB: reloved
    ports:
      - "55432:5432"
    volumes:
      - reloved_pgdata:/var/lib/postgresql/data

volumes:
  reloved_pgdata:
